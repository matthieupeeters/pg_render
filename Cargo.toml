[package]
name = "pg_render"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pg_render"
path = "src/bin/pgrx_embed_pg_render.rs"

[features]
default = ["pg18"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []

[dependencies]
serde_json = "1.0"
md5 = "0.7"
liquid = "0.26.11"
handlebars = "6.4.4"
pgrx = { version = "0.19.3", features = ["pg18"] }

[dev-dependencies]
pgrx-tests = "0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
